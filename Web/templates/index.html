<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeepLIIF Web</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    /* Upload-page specific layout (overrides the vendored CSS reset
       so headings + paragraphs have visible spacing) */
    .upload-card { max-width: min(1280px, 95vw); margin: 1rem auto; padding: 1.5rem 2rem;
                   background: #fff; border-radius: 8px;
                   box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .upload-card h1 { margin-bottom: 0.6rem; }
    .upload-card > p { color: #5a6373; margin-bottom: 1.25rem; }
    #file-input { display: none; }
    #drop-area { border: 2px dashed #888; padding: 2rem; text-align: center;
                 border-radius: 8px; cursor: pointer; background: #f8f9fb;
                 position: relative; }
    #drop-area.over { border-color: #3d6acc; background: #eef; }
    #drop-area p { margin: 0; color: #5a6373; }
    /* When a file/sample is chosen, the placeholder text hides and the
       preview image takes the slot */
    #drop-area.has-preview { padding: 0.75rem; background: #fff; border-style: solid;
                             border-color: #3d6acc; }
    #drop-area.has-preview .drop-placeholder { display: none; }
    /* 预览图片:在卡片内尽量铺大,长边贴满较小的那条边界 */
    #preview { display: none; max-width: 100%; max-height: 80vh;
               width: auto; height: auto; border-radius: 4px;
               margin: 0 auto; object-fit: contain; }
    /* 进入预览态时缩小 padding 与多余空白,让图片占更多视野 */
    #drop-area.has-preview { padding: 0.25rem; min-height: 0; }
    #drop-area.has-preview #preview { display: block; }
    .preview-meta { margin-top: 0.5rem; color: #5a6373; font-size: 0.85em; }
    #drop-area.has-preview .preview-meta { display: block; }
    .preview-meta { display: none; }
    .clear-preview { display: none; margin-left: 0.5em; color: #C1272D;
                     cursor: pointer; text-decoration: underline; }
    #drop-area.has-preview .clear-preview { display: inline; }
    #loading { display: none; position: fixed; inset: 0;
               background: rgba(0,0,0,.5); color: #fff;
               align-items: center; justify-content: center; font-size: 1.5rem; }
    #loading.on { display: flex; }
    .samples { margin-top: 1.5rem; }
    .samples > p { margin-bottom: 0.4rem; color: #5a6373; }
    .samples label { display: inline-block; margin-right: 1rem; }
    .resolution-picker { margin-top: 1.25rem; }
    .resolution-picker select { margin-left: 0.5rem; padding: 0.25rem 0.5rem; }
    #submit-btn { margin-top: 1.5rem; }
  </style>
</head>
<body>
 <div class="upload-card">
  <h1>DeepLIIF Web</h1>
  <p>Upload an IHC image (PNG/JPEG/TIFF, up to {{ max_mb }} MB, {{ max_edge }} px per side).</p>

  <form id="upload-form" method="post" action="/upload" enctype="multipart/form-data">
    <div id="drop-area">
      <input id="file-input" type="file" name="file"
             accept="image/png,image/jpeg,image/tiff">
      <p class="drop-placeholder">Click to choose an image, or drag a file here</p>
      <img id="preview" alt="preview">
      <div class="preview-meta">
        <span id="preview-name"></span>
        <a href="#" class="clear-preview">remove</a>
      </div>
    </div>

    <div class="samples">
      <p>Or pick a sample:</p>
      <label><input type="radio" name="sample" value="ROI_1.png"> ROI_1</label>
      <label><input type="radio" name="sample" value="ROI_7.png"> ROI_7</label>
      <label><input type="radio" name="sample" value="ROI_46.png"> ROI_46</label>
    </div>

    <div class="resolution-picker">
      <label for="upload-resolution">Image resolution:</label>
      <select name="resolution" id="upload-resolution">
        <option value="10">10X (1 μm/pixel)</option>
        <option value="20">20X (0.5 μm/pixel)</option>
        <option value="40" selected>40X (0.25 μm/pixel)</option>
      </select>
    </div>

    <button id="submit-btn" type="submit" disabled>Run inference</button>
  </form>

  <div id="loading"><span>Processing…</span></div>

  <script>
    const form = document.getElementById('upload-form');
    const drop = document.getElementById('drop-area');
    const fileInput = document.getElementById('file-input');
    const submitBtn = document.getElementById('submit-btn');
    const loading = document.getElementById('loading');
    const preview = document.getElementById('preview');
    const previewName = document.getElementById('preview-name');
    const clearLink = document.querySelector('.clear-preview');

    function showPreview(src, name) {
      preview.src = src;
      previewName.textContent = name || '';
      drop.classList.add('has-preview');
    }

    function clearPreview() {
      // revoke previous object URL to avoid leaking
      if (preview.src && preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src);
      preview.removeAttribute('src');
      previewName.textContent = '';
      drop.classList.remove('has-preview');
      fileInput.value = '';
      document.querySelectorAll('input[name=sample]').forEach(r => r.checked = false);
      refreshSubmit();
    }

    function refreshSubmit() {
      const hasFile = fileInput.files && fileInput.files.length > 0;
      const hasSample = !!document.querySelector('input[name=sample]:checked');
      submitBtn.disabled = !(hasFile || hasSample);
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files.length > 0) {
        // selecting a real file clears any pending sample choice
        document.querySelectorAll('input[name=sample]').forEach(r => r.checked = false);
        const f = fileInput.files[0];
        showPreview(URL.createObjectURL(f), f.name);
      }
      refreshSubmit();
    });

    drop.addEventListener('click', (e) => {
      // ignore clicks on the remove link (it has its own handler)
      if (e.target.classList.contains('clear-preview')) return;
      fileInput.click();
    });

    document.querySelectorAll('input[name=sample]').forEach(r => {
      r.addEventListener('change', () => {
        if (r.checked) {
          // sample selection trumps any previously chosen file
          fileInput.value = '';
          showPreview('/static/samples/' + r.value, r.value);
        }
        refreshSubmit();
      });
    });

    clearLink.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); clearPreview(); });

    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('over');
      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        // trigger the file-input change handler manually so preview updates
        fileInput.dispatchEvent(new Event('change'));
      }
    });

    form.addEventListener('submit', async (e) => {
      const sample = document.querySelector('input[name=sample]:checked');
      if (sample && fileInput.files.length === 0) {
        e.preventDefault();
        loading.classList.add('on');
        try {
          const res = await fetch('/static/samples/' + sample.value);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const dt = new DataTransfer();
          dt.items.add(new File([blob], sample.value, {type: blob.type}));
          fileInput.files = dt.files;
          form.submit();
        } catch (err) {
          loading.classList.remove('on');
          alert('Failed to load sample: ' + err.message);
        }
      } else {
        loading.classList.add('on');
      }
    });
  </script>
 </div>
</body>
</html>
